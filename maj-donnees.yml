name: Mise à jour des données

on:
  schedule:
    - cron: "0 9 * * 1"   # chaque lundi, 9 h UTC
  workflow_dispatch:       # bouton « Run workflow » dans l'onglet Actions

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas
      - name: Télécharger les sources
        run: python scripts/fetch_sources.py
      - name: Construire data.json
        run: python scripts/build_data.py signalisation_stationnement.csv geobase.json data.json
      - name: Publier si les données ont changé
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Données du $(date +%F)"
          git push
